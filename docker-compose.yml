name: grok2api

services:
  grok2api:
    container_name: grok2api
    image: "${GROK2API_IMAGE:-ghcr.io/zhujiane/grok2api:latest}"
    ports:
      - "${GROK2API_PORT:-8002}:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 非空时覆盖 config.yaml 的 PostgreSQL DSN，并自动启用 postgres。
      GROK2API_DATABASE_URL: "${GROK2API_DATABASE_URL:-}"
      GROK2API_QUALITY_GUARD_DIR: /var/lib/grok2api-quality-guard
      # 宿主机 Docker 若配置了全局代理，会向容器注入 HTTP(S)_PROXY，导致容器内
      # 健康检查（127.0.0.1）和访问 statsig-signer 等内部服务被错误代理。
      # 网关自身的出站代理由“出口代理”设置显式管理，这里显式清空。
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    volumes:
      - "${GROK2API_CONFIG:-./config.yaml}:/run/grok2api/config.yaml:ro"
      - grok2api-data:/app/data
      - quality_guard_state:/var/lib/grok2api-quality-guard
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # ================================ WARP (已停用) ================================
  # 出口代理：在管理端“设置 -> 出口代理”中新增 socks5://warp:1080。
  # 主机映射避开 1080 占用，容器内仍是 1080，Compose 网络用 socks5://warp:1080。
  # 当前部署不使用 WARP，如需启用请取消以下注释。

  # warp:
  #   container_name: warp
  #   image: caomingjun/warp:latest
  #   restart: unless-stopped
  #   # add removed tun rule back (https://github.com/opencontainers/runc/pull/3468)
  #   device_cgroup_rules:
  #     - "c 10:200 rwm"
  #   ports:
  #     - "127.0.0.1:${WARP_PORT:-10808}:1080"
  #   environment:
  #     - WARP_SLEEP=2
  #   cap_add:
  #     - MKNOD
  #     - AUDIT_WRITE
  #     - NET_ADMIN
  #   sysctls:
  #     - net.ipv6.conf.all.disable_ipv6=0
  #     - net.ipv4.conf.all.src_valid_mark=1
  #   volumes:
  #     - warp-data:/var/lib/cloudflare-warp

  # ================================ FLARESOLVERR (已停用) ================================
  # 在管理端将 Clearance 模式设为 FlareSolverr 或按需刷新，并使用 http://flaresolverr:8191。
  # 当前部署不使用 FlareSolverr，如需启用请取消以下注释。

  # flaresolverr:
  #   container_name: flaresolverr
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   environment:
  #     TZ: Asia/Shanghai
  #     LOG_LEVEL: info
  #   restart: unless-stopped

  # ================================ STATSIG SIGNER ================================
  # 替换默认的 https://grok.wodf.de/sign。启动后在管理端设置：
  #   Grok Web → x-statsig 获取方式 = URL
  #   签名服务 URL = http://statsig-signer:8788/sign
  # 纯 JS 签名；不再依赖 WARP、FlareSolverr 或 Chromium。
  # REFRESH_REMOTE 用 Node 直连（经 Docker 注入的 http_proxy）定时刷新曲线，
  # 上游换构建后自动更新，失败时回退内置快照。

  statsig-signer:
    container_name: grok2api-statsig-signer
    image: "${STATSIG_SIGNER_IMAGE:-ghcr.io/zhujiane/grok2api-statsig-signer:latest}"
    build:
      context: ./tools/statsig-signer
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${STATSIG_SIGNER_PORT:-8788}:8788"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      LISTEN: "0.0.0.0:8788"
      GROK_BASE_URL: "${GROK_BASE_URL:-https://grok.com}"
      REFRESH_REMOTE: "${STATSIG_REFRESH_REMOTE:-true}"
      STATSIG_SIGNER_TOKEN: "${STATSIG_SIGNER_TOKEN:-}"
      DATA_DIR: /data
      REFRESH_INTERVAL: "${STATSIG_REFRESH_INTERVAL:-10m}"
    volumes:
      - statsig-signer-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true


  # ================================ EGRESS QUALITY GUARD ================================
  # 可选的 Grok Build 出口质量守护 sidecar。默认不启动，也不会产生探测请求。
  # 启用前在 config.yaml 中配置 qualityGuard，然后执行：
  # docker compose --profile quality-guard up -d --build

  egress-quality-guard:
    container_name: grok2api-egress-quality-guard
    profiles: ["quality-guard"]
    build:
      context: .
      dockerfile: tools/egress-quality-guard/Dockerfile
    environment:
      # Default matches the Compose service name. Override for host networking
      # or a renamed grok2api service, e.g. http://127.0.0.1:8000
      GROK2API_BASE_URL: ${GROK2API_BASE_URL:-http://grok2api:8000}
    depends_on:
      grok2api:
        condition: service_healthy
    volumes:
      - quality_guard_state:/var/lib/grok2api-quality-guard
    restart: "on-failure:5"
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  grok2api-data:
  quality_guard_state:
  statsig-signer-data:
  # warp-data:
